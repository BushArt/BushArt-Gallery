name: Backup

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/bushart

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run backup script
        run: node ./node_modules/tsx/dist/cli.mjs scripts/backup.ts

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: mongo-backup-${{ github.run_number }}
          path: backups/
          if-no-files-found: warn
