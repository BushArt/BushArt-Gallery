# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/bushart-test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
      CLOUDINARY_CLOUD_NAME: test-cloud
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare test reports
        run: mkdir -p ci-reports

      - name: Setup database indexes
        run: npm run db:setup

      - name: Lint
        run: npm run lint

      - name: Test with coverage gate
        # `default` keeps failures readable in the job log; `json` feeds test:counts.
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=ci-reports/vitest.json

      - name: Upload Vitest report
        # Upload even when the gate fails, so a red run still yields a report.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: ci-reports/vitest.json
          if-no-files-found: warn

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/bushart-e2e
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
      CLOUDINARY_CLOUD_NAME: test-cloud
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare test reports
        run: mkdir -p ci-reports

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database indexes
        run: npm run db:setup

      - name: Seed E2E data
        run: node ./node_modules/tsx/dist/cli.mjs scripts/seed-e2e.ts

      - name: E2E tests
        run: node ./node_modules/playwright/cli.js test --reporter=json > ci-reports/playwright.json

      - name: Download Vitest report
        uses: actions/download-artifact@v4
        with:
          name: vitest-report
          path: ci-reports

      - name: Check test counts
        run: npm run test:counts -- ci-reports/vitest.json ci-reports/playwright.json
